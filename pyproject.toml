[project]
name = "um"
version = "0.1.0"
description = "Website for the OSRS clan Unthinking Majority."
authors = [{ name = "Ciaran Sanders", email = "ciaransanders@gmail.com" }]
readme = "README.md"
requires-python = "~3.12"

[tool.poetry.dependencies]
boto3 = "~1.43"
dj-database-url = "~3.1.2"
# django-admin-autocomplete-filter is old and unmaintained, would like to get rid of it someday
django-admin-autocomplete-filter = "^0.7"
django-extensions = "~4.1"
django-filter = "^26.1"
django-formtools = "~2.7"
django-notifications-hq = { git = "https://github.com/django-notifications/django-notifications", rev = "4c44bcea2504d9a3fcd26366b232a13732a08f2a" }
django-polymorphic = "~4.11.7"
djangorestframework = "~3.18.1"
django-storages = "~1.14.6"
django-tailwind = "~4.5.0"
django = "~5.2.0"
gunicorn = "^26.2.0"
pillow = "~12.3.0"
psycopg2 = "~2.9.13"
requests = "~2.34.2"
sentry-sdk = "~2.71.0"
wheel = "~0.45.1"
whitenoise = "~6.12.0"
wagtail = "~8.0.0"
Wand = "~0.7.2"
aiohttp = "~3.14.3"
django-adminactions = "~2.4.0"

[tool.poetry.group.dev.dependencies]
django-browser-reload = "^1.21.0"
django-debug-toolbar = "^8.0.0"
black = { extras = ["d"], version = "^26.5.1" }
ipython = "^9.6"
pre-commit = "^4.6.2"
django-stubs = "^5.2.5"
django-types = "^0.24.0"
djlint = "^1.46.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
classifiers = ["Private :: Do not Upload"]

[tool.pyright]
extraPaths = ["."]
django-stubs = true
typeCheckingMode = "off"
reportMissingTypeStubs = false
reportOptionalMemberAccess = false
reportGeneralTypeIssues = false
reportReturnType = false
pythonPlatform = "Linux"

[tool.django-stubs]
django_settings_module = "um.settings"

[tool.djlint]
profile = "django"
# Rules the existing templates already break; fix them before re-enabling.
ignore = "H013,H014,H022,H043,H046,T001,T038"
